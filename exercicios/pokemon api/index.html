<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéAPI - Pokédex Simples</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="pokedex-container">
        
        <h1 id="nome-pokemon">Carregando...</h1> 
        
        <div class="display-screen">
            <img id="foto-pokemon" alt="Sprite do Pokémon" width="150">
        </div>

        <div class="controles">
            <button id="botao-anterior" class="pokedex-button" disabled>Anterior</button>
            <button id="botao-proximo" class="pokedex-button">Próximo</button>
        </div>

    </div>

    <script src="script.js" defer></script>
</body>
</html>
